services:
  tenant-app:
    build: ./tenant-app
    image: tenant-app:local
    container_name: tenant-demo
    ports:
      - "8080:8080"
    environment:
      TENANT_NAME: acme
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: tenant-backend
    ports:
      - "5000:5000"
    environment:
      DB_PATH: /app/data/tenants.db
      JENKINS_URL: http://jenkins:8080
      JENKINS_JOB: tenant-deployment
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data: